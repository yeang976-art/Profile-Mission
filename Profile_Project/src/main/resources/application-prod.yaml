spring:
  datasource:
    url: jdbc:mysql://localhost:3306/info
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  config:
    import: aws-parameterstore:/camp-health-app/prod/


management:
  endpoint:
    health:
      show-details: never

  info:
    env:
      enabled: true


info:
  app:
    message: ${APP_MESSAGE}


logging:
  level:
    root: ERROR