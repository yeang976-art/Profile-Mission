spring:
  application:
    name: Profile_Project

  profiles:
    active: local, prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info