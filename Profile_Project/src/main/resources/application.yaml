spring:
  application:
    name: Profile_Project

  # 프로필을 따로 지정하지 않은 로컬 실행의 기본값
  profiles:
    default: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

  info:
    env:
      enabled: true